<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="ue-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#071215" />
      <stop offset="50%" stop-color="#0B2022" />
      <stop offset="100%" stop-color="#061014" />
    </linearGradient>
    <linearGradient id="ue-card" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E2829" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#0A1C1D" stop-opacity="0.95" />
    </linearGradient>
    <linearGradient id="ue-civic" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
    <filter id="ue-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="750" rx="16" fill="url(#ue-bg)" stroke="#164E4D" stroke-width="2"/>

  <!-- Top Titlebar -->
  <rect width="1200" height="56" rx="16" fill="#08181A" />
  <rect y="40" width="1200" height="16" fill="#08181A" />
