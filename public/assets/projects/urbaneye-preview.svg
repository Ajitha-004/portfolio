  <circle cx="36" cy="28" r="6" fill="#EF4444" opacity="0.8"/>
  <circle cx="58" cy="28" r="6" fill="#F59E0B" opacity="0.8"/>
  <circle cx="80" cy="28" r="6" fill="#10B981" opacity="0.8"/>
  
  <rect x="120" y="16" width="370" height="26" rx="6" fill="#0F2426" stroke="#1C4B4C" stroke-width="1"/>
  <text x="140" y="33" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="12" font-weight="500">urbaneye.city/civic-reporting/coimbatore-ward14</text>

