  <rect x="65" y="400" width="445" height="60" rx="8" fill="#081617" stroke="#163F40" stroke-width="1"/>
  <text x="80" y="424" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="12">Severe pothole near Avinashi Road junction causing congestion...</text>

