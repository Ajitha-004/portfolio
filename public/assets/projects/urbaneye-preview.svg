  <line x1="630" y1="340" x2="1080" y2="340" stroke="#1C4B4C" stroke-width="3"/>
  <line x1="630" y1="340" x2="880" y2="340" stroke="#10B981" stroke-width="3"/>
  
  <circle cx="630" cy="340" r="10" fill="#10B981"/>
  <text x="630" y="365" fill="#34D399" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">Reported</text>

  <circle cx="780" cy="340" r="10" fill="#10B981"/>
  <text x="780" y="365" fill="#34D399" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">Inspected</text>

  <circle cx="930" cy="340" r="10" fill="#06B6D4"/>
  <text x="930" y="365" fill="#67E8F9" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">Work Crew</text>

  <circle cx="1080" cy="340" r="10" fill="#173F40"/>
  <text x="1080" y="365" fill="#64748B" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">Resolved</text>

  <!-- City Ward Resolution Statistics -->
  <text x="595" y="425" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="14" font-weight="600">Ward 14 Civic Health &amp; Analytics</text>

  <rect x="595" y="445" width="165" height="110" rx="8" fill="#081719" stroke="#184646" stroke-width="1"/>
  <text x="615" y="475" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="11">Total Reports</text>
  <text x="615" y="515" fill="#34D399" font-family="system-ui, sans-serif" font-size="28" font-weight="800">1,248</text>
  <text x="615" y="538" fill="#6EE7B7" font-family="system-ui, sans-serif" font-size="10">Active citizens: 840</text>

  <rect x="780" y="445" width="165" height="110" rx="8" fill="#081719" stroke="#184646" stroke-width="1"/>
  <text x="800" y="475" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="11">Resolved Issues</text>
  <text x="800" y="515" fill="#06B6D4" font-family="system-ui, sans-serif" font-size="28" font-weight="800">1,173</text>
  <text x="800" y="538" fill="#67E8F9" font-family="system-ui, sans-serif" font-size="10">94% Success rate</text>

  <rect x="965" y="445" width="165" height="110" rx="8" fill="#081719" stroke="#184646" stroke-width="1"/>
  <text x="985" y="475" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="11">Avg Turnaround</text>
  <text x="985" y="515" fill="#A78BFA" font-family="system-ui, sans-serif" font-size="28" font-weight="800">38 hrs</text>
  <text x="985" y="538" fill="#C4B5FD" font-family="system-ui, sans-serif" font-size="10">Fast priority dispatch</text>

  <!-- Civic Impact Quote -->
  <rect x="595" y="580" width="535" height="105" rx="8" fill="#0B2022" stroke="#184646" stroke-width="1"/>
  <text x="615" y="610" fill="#34D399" font-family="system-ui, sans-serif" font-size="12" font-weight="700">Citizen Social Impact Vision:</text>
  <text x="615" y="632" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="11">Empowering local community residents to actively participate in infrastructure stewardship</text>
  <text x="615" y="650" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="11">while promoting public municipal accountability through real-time tracking.</text>
