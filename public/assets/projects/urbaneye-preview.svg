  <rect x="0" y="56" width="1200" height="65" fill="#091B1D" />
  <line x1="0" y1="121" x2="1200" y2="121" stroke="#143B3B" stroke-width="1" />

  <rect x="40" y="71" width="35" height="35" rx="8" fill="url(#ue-civic)" filter="url(#ue-glow)"/>
  <text x="49" y="95" fill="#FFFFFF" font-family="system-ui, sans-serif" font-weight="800" font-size="18">U</text>
  <text x="86" y="92" fill="#FFFFFF" font-family="system-ui, sans-serif" font-weight="700" font-size="18">Urban<tspan fill="#34D399">Eye</tspan></text>
  <text x="86" y="106" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="11">Civic Infrastructure Incident Tracking &amp; Citizen Resolution Portal</text>

