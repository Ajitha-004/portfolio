  <text x="80" y="278" fill="#34D399" font-family="system-ui, sans-serif" font-size="18">🚧</text>
  <text x="110" y="272" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="12" font-weight="700">Road Damage / Pothole</text>
  <text x="110" y="287" fill="#6EE7B7" font-family="system-ui, sans-serif" font-size="10">High vehicle risk</text>

  <!-- Category 2: Garbage -->
  <rect x="295" y="248" width="215" height="50" rx="8" fill="#0B1C1D" stroke="#184343" stroke-width="1"/>
