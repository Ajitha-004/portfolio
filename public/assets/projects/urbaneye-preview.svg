  <text x="340" y="272" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Garbage Accumulation</text>
  <text x="340" y="287" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="10">Waste management</text>

  <!-- Category 3: Water Leakage -->
  <rect x="65" y="308" width="215" height="50" rx="8" fill="#0B1C1D" stroke="#184343" stroke-width="1"/>
  <text x="80" y="338" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="18">💧</text>
  <text x="110" y="332" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Water Pipe Leakage</text>
  <text x="110" y="347" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="10">Clean supply line</text>

  <!-- Category 4: Street Light -->
  <rect x="295" y="308" width="215" height="50" rx="8" fill="#0B1C1D" stroke="#184343" stroke-width="1"/>
  <text x="310" y="338" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="18">💡</text>
