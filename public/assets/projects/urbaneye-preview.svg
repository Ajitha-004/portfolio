  <rect x="65" y="495" width="445" height="38" rx="8" fill="#081617" stroke="#163F40" stroke-width="1"/>
  <text x="80" y="519" fill="#34D399" font-family="system-ui, sans-serif" font-size="12">📍 GPS Locked: 11.0168° N, 76.9558° E (Avinashi Rd, Peelamedu)</text>

  <rect x="65" y="545" width="445" height="75" rx="8" fill="#091E1F" stroke="#1C4B4C" stroke-dasharray="4" stroke-width="1.5"/>
  <text x="287" y="580" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">📷 Photo attached: pothole_evidence_nov26.jpg (2.4 MB)</text>
  <text x="287" y="598" fill="#34D399" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">✓ Metadata &amp; Timestamp Verified</text>

