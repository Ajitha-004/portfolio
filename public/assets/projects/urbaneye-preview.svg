  <rect x="595" y="205" width="535" height="185" rx="10" fill="#081719" stroke="#1D5353" stroke-width="1.5"/>
  
  <rect x="615" y="222" width="95" height="24" rx="4" fill="#F59E0B" fill-opacity="0.2"/>
  <text x="627" y="238" fill="#FBBF24" font-family="system-ui, sans-serif" font-size="11" font-weight="700">IN PROGRESS</text>
  
  <text x="720" y="238" fill="#94A3B8" font-family="monospace" font-size="11">Ticket ID: #UE-8492</text>
  <text x="980" y="238" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="11">Reported: 4h ago</text>

  <text x="615" y="275" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="16" font-weight="700">Deep Asphalt Pothole - Avinashi Road Intersection</text>
  <text x="615" y="296" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="12">Assigned to: Central Highways Repair Division · Ward 14 Team</text>

