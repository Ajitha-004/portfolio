<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="fn-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0D1B" />
      <stop offset="50%" stop-color="#12162E" />
      <stop offset="100%" stop-color="#080914" />
    </linearGradient>
    <linearGradient id="fn-card" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#191E3B" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#121528" stop-opacity="0.9" />
    </linearGradient>
    <linearGradient id="fn-purple-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>
    <linearGradient id="fn-gauge" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="70%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>
    <filter id="fn-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="750" rx="16" fill="url(#fn-bg)" stroke="#262E58" stroke-width="2"/>

  <!-- Top Window Titlebar -->
  <rect width="1200" height="56" rx="16" fill="#0E1224" />
  <rect y="40" width="1200" height="16" fill="#0E1224" />
  <line x1="0" y1="56" x2="1200" y2="56" stroke="#232A4E" stroke-width="1.5" />
  <circle cx="36" cy="28" r="6" fill="#EF4444" opacity="0.8"/>
  <circle cx="58" cy="28" r="6" fill="#F59E0B" opacity="0.8"/>
  <circle cx="80" cy="28" r="6" fill="#10B981" opacity="0.8"/>
  
  <rect x="120" y="16" width="360" height="26" rx="6" fill="#181E38" stroke="#28325C" stroke-width="1"/>
  <text x="140" y="33" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="500">veritas-ai.ml/dashboard/news-classifier</text>
  
  <!-- Conceptual Preview Label Badge -->
  <rect x="940" y="14" width="220" height="28" rx="6" fill="#8B5CF6" fill-opacity="0.15" stroke="#8B5CF6" stroke-width="1"/>
  <text x="955" y="32" fill="#C4B5FD" font-family="system-ui, sans-serif" font-size="11" font-weight="600" letter-spacing="0.5">CONCEPTUAL UI PREVIEW</text>

  <!-- Left Sidebar -->
  <rect x="0" y="56" width="240" height="694" fill="#0B0E1E" />
  <line x1="240" y1="56" x2="240" y2="750" stroke="#232A4E" stroke-width="1" />

  <!-- App Logo -->
  <rect x="28" y="80" width="38" height="38" rx="10" fill="url(#fn-purple-blue)" filter="url(#fn-glow)"/>
  <text x="40" y="105" fill="#FFFFFF" font-family="system-ui, sans-serif" font-weight="800" font-size="20">V</text>
  <text x="78" y="96" fill="#FFFFFF" font-family="system-ui, sans-serif" font-weight="700" font-size="16">Veritas<tspan fill="#8B5CF6">AI</tspan></text>
  <text x="78" y="112" fill="#64748B" font-family="system-ui, sans-serif" font-weight="500" font-size="11">NLP Fake News Classifier</text>

  <!-- Sidebar Nav Items -->
  <rect x="20" y="146" width="200" height="40" rx="8" fill="#1E2648" stroke="#8B5CF6" stroke-width="1"/>
  <text x="56" y="171" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="13" font-weight="600">Article Classifier</text>
  <circle cx="38" cy="166" r="4" fill="#8B5CF6"/>

  <rect x="20" y="196" width="200" height="40" rx="8" fill="transparent"/>
  <text x="56" y="221" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="13" font-weight="500">TF-IDF Vector Space</text>
  <circle cx="38" cy="216" r="4" fill="#475569"/>

  <rect x="20" y="246" width="200" height="40" rx="8" fill="transparent"/>
  <text x="56" y="271" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="13" font-weight="500">Model Evaluation</text>
  <circle cx="38" cy="266" r="4" fill="#475569"/>

  <rect x="20" y="296" width="200" height="40" rx="8" fill="transparent"/>
  <text x="56" y="321" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="13" font-weight="500">Dataset Logs</text>
  <circle cx="38" cy="316" r="4" fill="#475569"/>

  <!-- Pipeline Status Widget in Sidebar -->
  <rect x="20" y="580" width="200" height="130" rx="10" fill="#12162D" stroke="#252D54" stroke-width="1"/>
  <text x="34" y="605" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Model Pipeline: Online</text>
  <text x="34" y="626" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="11">Architecture: Logistic Regression</text>
  <text x="34" y="644" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="11">Vocab Size: 18,450 tokens</text>
  <rect x="34" y="660" width="170" height="6" rx="3" fill="#1F274B"/>
  <rect x="34" y="660" width="158" height="6" rx="3" fill="url(#fn-purple-blue)"/>
  <text x="34" y="688" fill="#10B981" font-family="system-ui, sans-serif" font-size="10" font-weight="600">● 93.6% Benchmark Accuracy</text>

  <!-- MAIN CONTENT AREA -->
  <!-- Top Banner / Header -->
  <text x="275" y="105" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="22" font-weight="700">Real-Time News Veracity Analyzer</text>
  <text x="275" y="128" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="13">Input article headline or full body content to evaluate lexical markers and credibility scores.</text>

  <!-- Left Main Column: News Input Area -->
  <rect x="275" y="150" width="560" height="340" rx="12" fill="url(#fn-card)" stroke="#2C3563" stroke-width="1.5"/>
  <text x="300" y="185" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="14" font-weight="600">Article Content Inspection</text>
  <rect x="710" y="170" width="105" height="24" rx="6" fill="#222B52" />
  <text x="725" y="186" fill="#A5B4FC" font-family="monospace" font-size="11">NLP-v2.1</text>

  <!-- Input Text Area Mockup -->
  <rect x="300" y="205" width="510" height="215" rx="8" fill="#0C0F22" stroke="#252D54" stroke-width="1"/>
  <text x="316" y="234" fill="#C7D2FE" font-family="system-ui, sans-serif" font-size="13" font-weight="600">Headline: Scientific Breakthrough in Quantum Computing Efficiency Verified</text>
  <text x="316" y="260" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="12" line-height="1.5">Researchers at prominent global computing institutes have published peer-reviewed findings</text>
  <text x="316" y="282" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="12">demonstrating a 40% reduction in thermal decoherence for superconducting qubits...</text>
  <text x="316" y="304" fill="#64748B" font-family="system-ui, sans-serif" font-size="12">The study cites verifiable metrics and multi-institutional replications across laboratories.</text>

  <rect x="316" y="380" width="120" height="24" rx="4" fill="#1C2344" />
  <text x="328" y="396" fill="#94A3B8" font-family="monospace" font-size="11">Tokens: 412 | TF-IDF</text>

  <!-- Predict Button -->
  <rect x="670" y="375" width="140" height="36" rx="8" fill="url(#fn-purple-blue)" filter="url(#fn-glow)"/>
  <text x="705" y="398" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Predict News</text>

  <!-- Right Column: Prediction Result Panel -->
  <rect x="860" y="150" width="310" height="340" rx="12" fill="url(#fn-card)" stroke="#2C3563" stroke-width="1.5"/>
  <text x="885" y="185" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="14" font-weight="600">Classification Result</text>

  <!-- Result Badge -->
  <rect x="885" y="205" width="260" height="75" rx="10" fill="#064E3B" fill-opacity="0.4" stroke="#059669" stroke-width="1.5"/>
  <circle cx="915" cy="242" r="14" fill="#10B981"/>
  <path d="M909 242 L913 246 L921 238" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="940" y="236" fill="#34D399" font-family="system-ui, sans-serif" font-size="15" font-weight="700">REAL NEWS</text>
  <text x="940" y="254" fill="#6EE7B7" font-family="system-ui, sans-serif" font-size="11">High Credibility Confidence</text>

  <!-- Confidence Score Meter -->
  <text x="885" y="315" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="12">Prediction Confidence Score</text>
  <text x="1090" y="315" fill="#38BDF8" font-family="system-ui, sans-serif" font-size="14" font-weight="700">94.8%</text>

  <rect x="885" y="328" width="260" height="12" rx="6" fill="#151A36"/>
  <rect x="885" y="328" width="246" height="12" rx="6" fill="url(#fn-gauge)"/>

  <!-- Linguistic Breakdown Markers -->
  <rect x="885" y="360" width="260" height="110" rx="8" fill="#0C0F22" stroke="#232A4E" stroke-width="1"/>
  <text x="900" y="382" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="11" font-weight="600">Feature Vector Diagnostics</text>
  <text x="900" y="404" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="11">Sensationalism Index: <tspan fill="#34D399" font-weight="600">Low (0.12)</tspan></text>
  <text x="900" y="424" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="11">Syntactic Objectivity: <tspan fill="#38BDF8" font-weight="600">High (0.89)</tspan></text>
  <text x="900" y="444" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="11">Source Citation Marker: <tspan fill="#A78BFA" font-weight="600">Detected</tspan></text>

  <!-- Bottom Row: Model Performance Section -->
  <rect x="275" y="515" width="895" height="195" rx="12" fill="url(#fn-card)" stroke="#2C3563" stroke-width="1.5"/>
  <text x="300" y="546" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="14" font-weight="600">Model Evaluation Metrics & Confusion Matrix</text>

  <!-- Metric Card 1 -->
  <rect x="300" y="565" width="190" height="120" rx="8" fill="#12162E" stroke="#252D54" stroke-width="1"/>
  <text x="320" y="594" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="12">Overall Accuracy</text>
  <text x="320" y="630" fill="#A78BFA" font-family="system-ui, sans-serif" font-size="28" font-weight="800">93.6%</text>
  <text x="320" y="658" fill="#10B981" font-family="system-ui, sans-serif" font-size="11">Benchmark: Test Split 20%</text>

  <!-- Metric Card 2 -->
  <rect x="510" y="565" width="190" height="120" rx="8" fill="#12162E" stroke="#252D54" stroke-width="1"/>
  <text x="530" y="594" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="12">Precision Score</text>
  <text x="530" y="630" fill="#38BDF8" font-family="system-ui, sans-serif" font-size="28" font-weight="800">92.4%</text>
  <text x="530" y="658" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="11">False Positive Rate: 4.8%</text>

  <!-- Metric Card 3 -->
  <rect x="720" y="565" width="190" height="120" rx="8" fill="#12162E" stroke="#252D54" stroke-width="1"/>
  <text x="740" y="594" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="12">Recall / Sensitivity</text>
  <text x="740" y="630" fill="#34D399" font-family="system-ui, sans-serif" font-size="28" font-weight="800">91.8%</text>
  <text x="740" y="658" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="11">True Positive Rate</text>

  <!-- Metric Card 4: F1 Score -->
  <rect x="930" y="565" width="220" height="120" rx="8" fill="#12162E" stroke="#252D54" stroke-width="1"/>
  <text x="950" y="594" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="12">Harmonic F1-Score</text>
  <text x="950" y="630" fill="#F472B6" font-family="system-ui, sans-serif" font-size="28" font-weight="800">92.1%</text>
  <text x="950" y="658" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="11">Balanced Classification</text>
</svg>

