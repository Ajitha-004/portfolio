<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="100%" height="100%" fill="none">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="fn-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070913" />
      <stop offset="50%" stop-color="#0E1228" />
      <stop offset="100%" stop-color="#090B18" />
    </linearGradient>

    <linearGradient id="fn-card" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141836" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0E1126" stop-opacity="0.95" />
    </linearGradient>

    <linearGradient id="fn-btn-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8B5CF6" />
      <stop offset="50%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>

    <linearGradient id="fn-real-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064E3B" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#022C22" stop-opacity="0.95" />
    </linearGradient>

    <linearGradient id="fn-meter-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="60%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>

    <linearGradient id="fn-purple-accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#A855F7" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>
  </defs>

  <!-- 1. Master Canvas Frame -->
  <rect width="1200" height="750" rx="20" fill="url(#fn-bg)" stroke="#2D3568" stroke-width="2"/>

  <!-- Subtle Ambient Glow Orbs -->
  <circle cx="150" cy="120" r="140" fill="#8B5CF6" fill-opacity="0.08"/>
  <circle cx="1050" cy="220" r="160" fill="#06B6D4" fill-opacity="0.07"/>
  <circle cx="600" cy="650" r="180" fill="#4F46E5" fill-opacity="0.06"/>

  <!-- 2. Window Header Bar -->
  <rect width="1200" height="58" rx="20" fill="#0D1022" />
  <rect y="40" width="1200" height="18" fill="#0D1022" />
  <line x1="0" y1="58" x2="1200" y2="58" stroke="#1F264A" stroke-width="1.5" />

  <!-- Window Dots -->
  <circle cx="36" cy="29" r="6.5" fill="#EF4444" />
  <circle cx="58" cy="29" r="6.5" fill="#F59E0B" />
  <circle cx="80" cy="29" r="6.5" fill="#10B981" />

  <!-- URL Address Bar -->
  <rect x="120" y="15" width="460" height="28" rx="8" fill="#151A36" stroke="#252D58" stroke-width="1"/>
  <text x="145" y="34" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500">
    🔒 https://veritas-ai.ml/dashboard/news-verification
  </text>

  <!-- Conceptual UI Indicator -->
  <rect x="940" y="14" width="225" height="30" rx="8" fill="#8B5CF6" fill-opacity="0.15" stroke="#8B5CF6" stroke-width="1.5"/>
  <text x="965" y="34" fill="#C4B5FD" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" letter-spacing="1">
    ML VERIFICATION UI
  </text>

  <!-- 3. Dashboard Top Navigation & Status Bar -->
  <rect x="0" y="58" width="1200" height="66" fill="#10142A" />
  <line x1="0" y1="124" x2="1200" y2="124" stroke="#1F264A" stroke-width="1.5" />

  <!-- App Logo / Title -->
  <rect x="35" y="74" width="36" height="36" rx="10" fill="url(#fn-purple-accent)"/>
  <path d="M47 84 L59 84 L53 100 Z" fill="#FFFFFF" opacity="0.95"/>
  <text x="82" y="93" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="17">
    Fake News Detection <tspan fill="#A855F7">System</tspan>
  </text>
  <text x="82" y="108" fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="500" font-size="11">
    Natural Language Processing &amp; Predictive Machine Learning Pipeline
  </text>

  <!-- ML Pipeline Status Pills -->
  <g transform="translate(680, 77)">
    <rect width="145" height="30" rx="8" fill="#151A38" stroke="#2B3666" stroke-width="1"/>
    <circle cx="16" cy="15" r="4" fill="#10B981"/>
    <text x="28" y="19" fill="#E2E8F0" font-family="-apple-system, sans-serif" font-size="11" font-weight="600">Model: Online (93.6%)</text>
  </g>

  <g transform="translate(835, 77)">
    <rect width="165" height="30" rx="8" fill="#151A38" stroke="#2B3666" stroke-width="1"/>
    <text x="14" y="19" fill="#A78BFA" font-family="-apple-system, sans-serif" font-size="11" font-weight="600">Vector: TF-IDF (18.4K)</text>
  </g>

  <g transform="translate(1010, 77)">
    <rect width="155" height="30" rx="8" fill="#151A38" stroke="#2B3666" stroke-width="1"/>
    <text x="14" y="19" fill="#38BDF8" font-family="-apple-system, sans-serif" font-size="11" font-weight="600">Engine: Scikit-Learn</text>
  </g>

  <!-- 4. MAIN WORKSPACE (2 Columns: Left Input Area, Right Prediction Results) -->

  <!-- LEFT COLUMN: News Headline Input Field & Article Inspection -->
  <g transform="translate(35, 145)">
    <rect width="680" height="375" rx="16" fill="url(#fn-card)" stroke="#262F5E" stroke-width="1.5"/>

    <!-- Section Header -->
    <text x="25" y="38" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="16" font-weight="700">
      Article Credibility Scanner
    </text>
    <text x="25" y="58" fill="#94A3B8" font-family="-apple-system, sans-serif" font-size="12">
      Enter news headline or full text below to evaluate syntactic markers, sensationalism, and veracity.
    </text>

    <!-- News Headline Input Field (Explicit User Requirement 5.1) -->
    <g transform="translate(25, 78)">
      <text x="2" y="-10" fill="#C4B5FD" font-family="-apple-system, sans-serif" font-size="12" font-weight="700">
        NEWS HEADLINE INPUT FIELD:
      </text>
      <rect width="630" height="52" rx="10" fill="#0A0D1E" stroke="#3B467E" stroke-width="1.5"/>
      <text x="20" y="32" fill="#E2E8F0" font-family="-apple-system, sans-serif" font-size="13" font-weight="600">
        Breaking: New Renewable Energy Breakthrough Reaches 42% Solar Cell Efficiency in Lab
      </text>
    </g>

    <!-- Full Article Body Input / Context Area -->
    <g transform="translate(25, 160)">
      <text x="2" y="-10" fill="#94A3B8" font-family="-apple-system, sans-serif" font-size="12" font-weight="600">
        Article Body Content (Optional Corpus Analysis):
      </text>
      <rect width="630" height="120" rx="10" fill="#0A0D1E" stroke="#252E58" stroke-width="1"/>
      <text x="20" y="28" fill="#94A3B8" font-family="-apple-system, sans-serif" font-size="12">
        A peer-reviewed study published by international researchers demonstrates verifiable laboratory replication
      </text>
      <text x="20" y="48" fill="#94A3B8" font-family="-apple-system, sans-serif" font-size="12">
        of tandem perovskite-silicon solar cells with stabilized power conversion metrics across continuous testing cycles.
      </text>
      <text x="20" y="68" fill="#64748B" font-family="-apple-system, sans-serif" font-size="12">
        Corpus characteristics: Objective semantic framing, empirical citations detected, minimal hyperbolic clickbait markers.
      </text>
      
      <!-- Input Tag Badges -->
      <g transform="translate(20, 88)">
        <rect width="95" height="22" rx="6" fill="#151A38" stroke="#2A3563" stroke-width="1"/>
        <text x="10" y="15" fill="#818CF8" font-family="monospace" font-size="10">Tokens: 384</text>
      </g>
      <g transform="translate(125, 88)">
        <rect width="115" height="22" rx="6" fill="#151A38" stroke="#2A3563" stroke-width="1"/>
        <text x="10" y="15" fill="#38BDF8" font-family="monospace" font-size="10">Stopwords: Stripped</text>
      </g>
      <g transform="translate(250, 88)">
        <rect width="125" height="22" rx="6" fill="#151A38" stroke="#2A3563" stroke-width="1"/>
        <text x="10" y="15" fill="#34D399" font-family="monospace" font-size="10">TF-IDF: Vectorized</text>
      </g>
    </g>

    <!-- Action Buttons Row: Analyze News Button (Explicit User Requirement 5.2) -->
    <g transform="translate(25, 305)">
      <!-- Primary: Analyze News Button -->
      <rect width="210" height="48" rx="12" fill="url(#fn-btn-grad)" />
      <g transform="translate(24, 15)">
        <!-- Search/Sparkle Icon -->
        <circle cx="8" cy="8" r="6" stroke="#FFFFFF" stroke-width="2" fill="none"/>
        <line x1="12" y1="12" x2="17" y2="17" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
        <text x="26" y="13" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="14" font-weight="800" letter-spacing="0.5">
          Analyze News
        </text>
      </g>

      <!-- Secondary: Clear & Reset -->
      <rect x="225" width="120" height="48" rx="12" fill="#151A38" stroke="#2B3666" stroke-width="1.5"/>
      <text x="255" y="29" fill="#94A3B8" font-family="-apple-system, sans-serif" font-size="13" font-weight="600">
        Reset
      </text>

      <!-- Model Latency Readout -->
      <text x="490" y="29" fill="#64748B" font-family="monospace" font-size="12">
        Latency: 42ms | TF-IDF + LR
      </text>
    </g>
  </g>

  <!-- RIGHT COLUMN: Prediction Result & Confidence Meter (User Requirements 5.3 & 5.4) -->
  <g transform="translate(735, 145)">
    <rect width="430" height="375" rx="16" fill="url(#fn-card)" stroke="#262F5E" stroke-width="1.5"/>

    <!-- Header -->
    <text x="25" y="38" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="16" font-weight="700">
      Prediction &amp; Diagnostic Result
    </text>
    <text x="25" y="58" fill="#94A3B8" font-family="-apple-system, sans-serif" font-size="12">
      Machine learning veracity classification with probabilistic confidence score.
    </text>

    <!-- Real/Fake Prediction Result Banner (Explicit User Requirement 5.3) -->
    <g transform="translate(25, 75)">
      <rect width="380" height="88" rx="14" fill="url(#fn-real-grad)" stroke="#10B981" stroke-width="2"/>
      
      <!-- Verified Shield Badge -->
      <circle cx="48" cy="44" r="24" fill="#10B981" fill-opacity="0.25"/>
      <circle cx="48" cy="44" r="18" fill="#10B981"/>
      <path d="M42 44 L46 48 L55 39" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

      <text x="86" y="36" fill="#34D399" font-family="-apple-system, sans-serif" font-size="19" font-weight="800" letter-spacing="0.5">
        REAL NEWS
      </text>
      <text x="86" y="56" fill="#A7F3D0" font-family="-apple-system, sans-serif" font-size="12" font-weight="600">
        ✓ High Credibility · Verified Linguistic Markers
      </text>
      <text x="86" y="72" fill="#6EE7B7" font-family="-apple-system, sans-serif" font-size="11">
        Confidence threshold exceeded (Real: 94.8% vs Fake: 5.2%)
      </text>
    </g>

    <!-- Confidence Score Visualization (Explicit User Requirement 5.4) -->
    <g transform="translate(25, 182)">
      <div xmlns="http://www.w3.org/1999/xhtml"></div>
      <text x="0" y="0" fill="#E2E8F0" font-family="-apple-system, sans-serif" font-size="13" font-weight="700">
        Confidence Score Visualization:
      </text>
      <text x="330" y="0" fill="#38BDF8" font-family="monospace" font-size="16" font-weight="800">
        94.8%
      </text>

      <!-- Meter Progress Bar -->
      <rect y="12" width="380" height="14" rx="7" fill="#0C0F22" stroke="#252E58" stroke-width="1"/>
      <rect y="12" width="360" height="14" rx="7" fill="url(#fn-meter-grad)"/>

      <text y="42" fill="#94A3B8" font-family="-apple-system, sans-serif" font-size="11">
        0% (Uncertain)
      </text>
      <text x="160" y="42" fill="#94A3B8" font-family="-apple-system, sans-serif" font-size="11">
        50% (Ambiguous)
      </text>
      <text x="325" y="42" fill="#10B981" font-family="-apple-system, sans-serif" font-size="11" font-weight="600">
        100% (High)
      </text>
    </g>

    <!-- Linguistic Feature Vectors Breakdown -->
    <g transform="translate(25, 252)">
      <rect width="380" height="102" rx="10" fill="#0A0D1E" stroke="#222B54" stroke-width="1"/>
      <text x="16" y="24" fill="#C4B5FD" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" letter-spacing="0.5">
        EXTRACTED LINGUISTIC FEATURES:
      </text>

      <text x="16" y="46" fill="#94A3B8" font-family="-apple-system, sans-serif" font-size="11">
        Sensationalism Rating: <tspan fill="#34D399" font-weight="700">Low (0.08)</tspan>
      </text>
      <text x="16" y="66" fill="#94A3B8" font-family="-apple-system, sans-serif" font-size="11">
        Objectivity &amp; Factual Tone: <tspan fill="#38BDF8" font-weight="700">High (0.93)</tspan>
      </text>
      <text x="16" y="86" fill="#94A3B8" font-family="-apple-system, sans-serif" font-size="11">
        Syntactic Complexity: <tspan fill="#A78BFA" font-weight="700">Academic / Technical</tspan>
      </text>
    </g>
  </g>

  <!-- 5. BOTTOM SECTION: Clean Machine Learning Performance Metrics (User Requirement 5.5) -->
  <g transform="translate(35, 540)">
    <rect width="1130" height="175" rx="16" fill="url(#fn-card)" stroke="#262F5E" stroke-width="1.5"/>

    <!-- Title -->
    <text x="25" y="32" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="14" font-weight="700">
      Machine Learning Classification Performance Metrics
    </text>
    <text x="25" y="48" fill="#94A3B8" font-family="-apple-system, sans-serif" font-size="11">
      Evaluated against benchmarked dataset splits with cross-validation matrices.
    </text>

    <!-- Metric Card 1: Accuracy -->
    <g transform="translate(25, 62)">
      <rect width="255" height="92" rx="10" fill="#0E1228" stroke="#252F5A" stroke-width="1"/>
      <text x="18" y="26" fill="#94A3B8" font-family="-apple-system, sans-serif" font-size="11" font-weight="600">Model Accuracy</text>
      <text x="18" y="58" fill="#A78BFA" font-family="monospace" font-size="28" font-weight="800">93.6%</text>
      <text x="18" y="78" fill="#10B981" font-family="-apple-system, sans-serif" font-size="10" font-weight="600">● Validated on Test Split</text>
    </g>

    <!-- Metric Card 2: Precision -->
    <g transform="translate(300, 62)">
      <rect width="255" height="92" rx="10" fill="#0E1228" stroke="#252F5A" stroke-width="1"/>
      <text x="18" y="26" fill="#94A3B8" font-family="-apple-system, sans-serif" font-size="11" font-weight="600">Precision Score</text>
      <text x="18" y="58" fill="#38BDF8" font-family="monospace" font-size="28" font-weight="800">92.4%</text>
      <text x="18" y="78" fill="#94A3B8" font-family="-apple-system, sans-serif" font-size="10">False Positive Rate: 4.8%</text>
    </g>

    <!-- Metric Card 3: Recall -->
    <g transform="translate(575, 62)">
      <rect width="255" height="92" rx="10" fill="#0E1228" stroke="#252F5A" stroke-width="1"/>
      <text x="18" y="26" fill="#94A3B8" font-family="-apple-system, sans-serif" font-size="11" font-weight="600">Recall / Sensitivity</text>
      <text x="18" y="58" fill="#34D399" font-family="monospace" font-size="28" font-weight="800">91.8%</text>
      <text x="18" y="78" fill="#94A3B8" font-family="-apple-system, sans-serif" font-size="10">True Positive Rate</text>
    </g>

    <!-- Metric Card 4: F1 Score -->
    <g transform="translate(850, 62)">
      <rect width="255" height="92" rx="10" fill="#0E1228" stroke="#252F5A" stroke-width="1"/>
      <text x="18" y="26" fill="#94A3B8" font-family="-apple-system, sans-serif" font-size="11" font-weight="600">Balanced F1-Score</text>
      <text x="18" y="58" fill="#F472B6" font-family="monospace" font-size="28" font-weight="800">92.1%</text>
      <text x="18" y="78" fill="#A855F7" font-family="-apple-system, sans-serif" font-size="10">Harmonic Mean</text>
    </g>
  </g>
</svg>
